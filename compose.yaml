services:
  api:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: ${APP_URL}
    volumes:
      # Em desenvolvimento, monta o código real para hot-reload.
      # Em produção (DOCKERFILE=Dockerfile), comentar esta linha é
      # recomendado, já que o código já vai embutido na imagem.
      - .:/var/www/html
      # Volume nomeado separado para os uploads (avatares/posts), para que
      # sobrevivam mesmo se o volume de código acima não for usado em prod.
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      - db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  storage_data:
